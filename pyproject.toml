[project]
name = "metaagent"
version = "0.2.0"
description = "A portfolio-ready MetaAgent chat app that routes tasks to MCP tools."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.5.1",
    "hypercorn>=0.17.3",
    "matplotlib>=3.9.0",
    "mcp>=1.7.1",
    "numpy>=2.0.0",
    "openai>=1.77.0",
    "pandas>=2.2.0",
    "python-dotenv>=1.1.0",
    "quart>=0.20.0",
    "requests>=2.32.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.2",
    "sympy>=1.12",
    "tiktoken>=0.9.0",
    "werkzeug>=3.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
